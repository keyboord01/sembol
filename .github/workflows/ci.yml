name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm --filter @sembol/passkey-react build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm --filter @sembol/passkey-react test

      - name: Build Storybook
        run: pnpm --filter sembol-storybook build

      - name: Build demo
        run: pnpm --filter sembol-demo build
